; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/Adafruit BusIO@^1.17.4
	kosme/arduinoFFT@^2.0.4

[env:esp32-s3-dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
; N16R8: 16MB Quad Flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags = 
	-DBOARD_S3_DEV
	-DBOARD_HAS_PSRAM
lib_deps = 
	${common.lib_deps}
	me-no-dev/ESPAsyncWebServer@^3.1.0
	me-no-dev/AsyncTCP@^3.2.0
	adafruit/Adafruit NeoPixel@^1.12.0

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.flash_size = 8MB
platform_packages = 
	framework-arduinoespressif32 @ ~3.20017.0
extra_scripts = post:scripts/copy_launcher_bin.py
build_flags = 
	-DBOARD_CARDPUTER_ADV
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps = 
	${common.lib_deps}
	m5stack/M5Cardputer@^1.1.1
	m5stack/M5GFX@0.2.26
